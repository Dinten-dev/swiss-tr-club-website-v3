name: Quality

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: node --test ../scripts/tests/baur-reset-password.cjs ../scripts/tests/gallery-upload.cjs ../scripts/tests/agenda-slider.cjs ../scripts/tests/route-history.cjs ../scripts/tests/mail-editor.cjs ../scripts/tests/registration-policy.cjs
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm run build:wordpress

  wordpress-plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wordpress/wp-content/plugins/strc-core
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer test
      - run: composer lint
      - run: php ../../../../scripts/tests/security-boundaries.php
      - run: php ../../../../scripts/tests/baur-feedback.php
      - run: php ../../../../scripts/tests/editorial-pr66.php
      - run: php ../../../../scripts/tests/mail-templates.php
      - run: php ../../../../scripts/tests/shop-editing.php
      - run: php -l ../../../../scripts/tests/security-staging.php
      - run: php -l ../../../../scripts/tests/editorial-staging.php
      - run: php -l ../../../../scripts/tests/pr71-pr75-staging.php

  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/validate-structure.mjs
