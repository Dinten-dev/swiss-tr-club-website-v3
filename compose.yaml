name: ${COMPOSE_PROJECT_NAME:-strc}

x-wordpress-config-extra: &wordpress-config-extra |
  define('WP_ENVIRONMENT_TYPE', 'local');
  define('WP_HOME', '${STRC_SITE_URL:-http://localhost:8080}');
  define('WP_SITEURL', '${STRC_SITE_URL:-http://localhost:8080}');
  defined('WP_DEBUG') || define('WP_DEBUG', true);
  define('WP_DEBUG_LOG', true);
  define('WP_DEBUG_DISPLAY', false);
  define('SCRIPT_DEBUG', true);
  define('DISALLOW_FILE_EDIT', true);
  define('WP_REDIS_HOST', 'redis');
  define('WP_REDIS_PORT', 6379);
  define('WP_CACHE_KEY_SALT', 'strc-local:');
  define('AUTOMATIC_UPDATER_DISABLED', true);
  define('STRC_FRONTEND_ORIGIN', '${STRC_FRONTEND_ORIGIN:-http://localhost:3000}');
  define('STRC_FAIRGATE_OID', '${STRC_FAIRGATE_OID:-}');
  define('STRC_FAIRGATE_ACCESS_KEY', '${STRC_FAIRGATE_ACCESS_KEY:-}');
  define('STRC_FAIRGATE_ADMIN_URL', '${STRC_FAIRGATE_ADMIN_URL:-}');
  define('STRC_FAIRGATE_API_BASE_URL', '${STRC_FAIRGATE_API_BASE_URL:-https://fsa.fairgate.ch}');

services:
  database:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${STRC_DB_NAME:-strc_wordpress}
      MARIADB_USER: ${STRC_DB_USER:-strc}
      MARIADB_PASSWORD: ${STRC_DB_PASSWORD:-local-only-change-me}
      MARIADB_ROOT_PASSWORD: ${STRC_DB_ROOT_PASSWORD:-local-root-change-me}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - database_data:/var/lib/mysql

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data

  wordpress:
    build:
      context: .
      dockerfile: infra/docker/wordpress/Dockerfile
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_NAME: ${STRC_DB_NAME:-strc_wordpress}
      WORDPRESS_DB_USER: ${STRC_DB_USER:-strc}
      WORDPRESS_DB_PASSWORD: ${STRC_DB_PASSWORD:-local-only-change-me}
      WORDPRESS_CONFIG_EXTRA: *wordpress-config-extra
    volumes:
      - wordpress_core:/var/www/html
      - ./wordpress/wp-content/plugins/strc-core:/var/www/html/wp-content/plugins/strc-core
      - ./wordpress/wp-content/themes/strc:/var/www/html/wp-content/themes/strc
      - ./scripts:/var/www/html/scripts:ro
      - wordpress_uploads:/var/www/html/wp-content/uploads

  web:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      - wordpress
    ports:
      - "${STRC_HTTP_PORT:-8080}:80"
    volumes:
      - wordpress_core:/var/www/html:ro
      - ./wordpress/wp-content/plugins/strc-core:/var/www/html/wp-content/plugins/strc-core:ro
      - ./wordpress/wp-content/themes/strc:/var/www/html/wp-content/themes/strc:ro
      - wordpress_uploads:/var/www/html/wp-content/uploads:ro
      - ./infra/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  wpcli:
    image: wordpress:cli-2.12.0-php8.3
    profiles: ["tools"]
    depends_on:
      database:
        condition: service_healthy
      wordpress:
        condition: service_started
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_NAME: ${STRC_DB_NAME:-strc_wordpress}
      WORDPRESS_DB_USER: ${STRC_DB_USER:-strc}
      WORDPRESS_DB_PASSWORD: ${STRC_DB_PASSWORD:-local-only-change-me}
      WORDPRESS_CONFIG_EXTRA: *wordpress-config-extra
    volumes:
      - wordpress_core:/var/www/html
      - ./wordpress/wp-content/plugins/strc-core:/var/www/html/wp-content/plugins/strc-core
      - ./wordpress/wp-content/themes/strc:/var/www/html/wp-content/themes/strc
      - ./scripts:/var/www/html/scripts:ro
      - wordpress_uploads:/var/www/html/wp-content/uploads

  composer:
    image: composer:2.8
    profiles: ["tools"]
    working_dir: /app
    volumes:
      - ./wordpress/wp-content/plugins/strc-core:/app

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "${STRC_MAILPIT_PORT:-8025}:8025"

volumes:
  database_data:
  redis_data:
  wordpress_core:
  wordpress_uploads:
